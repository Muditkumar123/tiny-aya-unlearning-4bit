# C2 (Plan B): C0 v2 unlearned with NPO + retain term (SafeTune npo_unlearn, variant npo_grad_diff), LoRA, merged to bf16.
# Frozen before any C2 run. Reason for each value: common/CHANGELOG.md, entry 2026-11-07 09:17 · Ganesh.
model:
  target: Ganesh/out/c0v2-target-merged     # C0 v2, bf16; also the frozen NPO reference (adapter switched off)
  tokenizer: CohereLabs/tiny-aya-global
  tokenizer_revision: af89d219b53ed9b13b8a4645f9c8028973510324
data:
  forget: common/data/tofu_author_split.json  # forget10, 400 Q&A, all 20 authors (H1 uses all 20)
  retain: locuslab/TOFU retain90             # 3,600 Q&A = full rows 0-3599
  retain_revision: 324592d84ae4f482ac7249b9285c2ecdb53e3a68
format:
  # Same prompt and answer tokens as C0 training (chat template, default preamble, answer + END_RESPONSE + END_OF_TURN).
  # Left padding with explicit position_ids; logits kept only for the answer span (same loss values, less memory).
  max_length: 512
npo:                       # safetune.unlearn.NPOConfig
  variant: npo_grad_diff   # NPO forget term + cross-entropy on retain (Zhang et al. 2025 "NPO_GDR")
  beta: 0.1                # Zhang et al. App. B.1; NPO authors' TOFU default
  npo_coeff: 1.0
  grad_diff_coeff: 1.0     # Zhang et al. Table 4, NEWS: alpha = 1 for NPO_GDR
  num_epochs: 10           # Zhang et al. App. D.1, NEWS; NPO authors' TOFU default
  optimizer: adamw
  weight_decay: 0.01       # NPO authors' TOFU default (Zhang et al. do not state one)
  lr_schedule: constant    # Zhang et al.: "fixed learning rate"; npo_unlearn has no scheduler
  batch_forget: 16         # one optimizer step per (16 forget, 16 retain) pair; 25 steps/epoch, 250 steps
  batch_retain: 16         # retain batches are a fresh seeded shuffle of retain90 every epoch
  seed: 0
lora:                      # same adapter shape as C0; Zhang et al. fine-tune all weights, which does not fit our GPU
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
lr_grid: [1.0e-5, 3.0e-5, 1.0e-4]   # Zhang et al. use 1e-5 for full fine-tuning; LoRA usually needs more
selection:
  # Fixed before any C2 run. Uses only bf16 merged models; no 4-bit model is built or scored before C2 is chosen.
  harness: Vedika/scripts/tofu_eval.py (frozen settings, CHANGELOG 2026-11-07 08:09 · Vedika)
  retention: scaled ROUGE-L recall, point estimate, (mean(M) - mean(original)) / (mean(C0 v2) - mean(original))
  rule: >-
    C2 = the smallest lr in lr_grid whose merged model has forget retention <= 0.25 (all 20 forget10 authors)
    and retain retention >= 0.50. If no lr meets both, C2 = the lr with the lowest forget retention among
    those with retain retention >= 0.50, and the entry says the target was missed. If every lr has retain
    retention < 0.50, stop and report (no C2).
  why: >-
    0.25 matches Zhang et al.'s utility-constrained regime (21% of forgotten knowledge kept in full precision);
    "smallest lr" keeps the weight change as small as the forgetting allows, which is the regime the
    hypothesis is about; retain >= 0.50 excludes collapsed models.
output:
  dir_pattern: Ganesh/out/c2-lr{lr}        # -adapter/ and -merged/ per grid point; the chosen one is linked as Ganesh/out/c2-unlearned-merged
